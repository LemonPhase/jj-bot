# Local PostgreSQL. Run with `docker compose up -d postgres` and set
# DATABASE_URL=postgresql://jj:jj_local@localhost:5433/jj_bot; without
# DATABASE_URL the API uses embedded PGlite and needs no Docker.
name: jj-bot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jj
      POSTGRES_PASSWORD: jj_local
      POSTGRES_DB: jj_bot
    ports:
      - "127.0.0.1:${JJ_POSTGRES_PORT:-5433}:5432"
    volumes:
      - jj_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jj -d jj_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  jj_postgres:
