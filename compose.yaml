# JJ Bot in one command. Put one model provider key in .env
# (`cp .env.example .env`), or a JJ_SECRET_KEY to enter keys in Settings,
# run `docker compose up -d --build --wait`, then
# open the link `docker compose logs app | grep -o 'Open JJ Bot: [^"]*'` prints. Compose
# reads .env only to fill the variables below. `docker compose up -d postgres`
# alone starts just the database for `npm run dev`. Two optional files go
# with this one: compose.image.yaml runs the published images instead of
# building, and compose.socket-proxy.yaml puts a socket proxy between the app
# and the Docker daemon. Details: docs/development.md, "Docker Compose".
name: jj-bot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jj
      POSTGRES_PASSWORD: jj_local
      POSTGRES_DB: jj_bot
    ports:
      - "127.0.0.1:${JJ_POSTGRES_PORT:-5433}:5432"
    volumes:
      - jj_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jj -d jj_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The API, serving the web app, with the worker embedded. Its sandboxes are
  # sibling containers on the host's daemon, started through the socket below.
  app:
    build:
      context: .
      args:
        # The app user's uid and gid, 10001 by default. No host account may
        # have it (docs/development.md, "Docker socket proxy").
        JJ_APP_UID: ${JJ_APP_UID:-10001}
    depends_on:
      postgres:
        condition: service_healthy
      # Not a running service: this only makes sure the sandbox image exists.
      sandbox-image:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://jj:jj_local@postgres:5432/jj_bot
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      # Listening on 0.0.0.0, the API always requires a token: API_TOKEN, or
      # one it generates on first boot and keeps in the database. The startup
      # line "Open JJ Bot: <API_PUBLIC_URL>/?token=…" carries it.
      API_TOKEN: ${API_TOKEN:-}
      API_PUBLIC_URL: http://127.0.0.1:${JJ_PORT:-3001}
      # The isolating docker driver only, so the default profile is docker.
      # Never enable `local` here: its commands would run in this container,
      # next to the model keys and the Docker socket.
      JJ_SANDBOX_DRIVERS: docker
      # One worker per namespace on a daemon, so each compose project has its own.
      JJ_DOCKER_NAMESPACE: ${JJ_DOCKER_NAMESPACE:-${COMPOSE_PROJECT_NAME:-jj-bot}}
      # Private range allowlist sandboxes take their /28 networks from; empty
      # uses the driver's default, 10.213.0.0/16.
      JJ_DOCKER_EGRESS_SUBNET_POOL: ${JJ_DOCKER_EGRESS_SUBNET_POOL:-}
      # Master key of the secrets store, for keys and secrets entered in
      # Settings: `echo "JJ_SECRET_KEY=$(openssl rand -base64 32)" >> .env`.
      # Only the environment holds it; back it up apart from the database.
      JJ_SECRET_KEY: ${JJ_SECRET_KEY:-}
      JJ_SECRET_KEY_PREVIOUS: ${JJ_SECRET_KEY_PREVIOUS:-}
      JJ_ENABLE_SCRIPTED_MODEL: ${JJ_ENABLE_SCRIPTED_MODEL:-false}
      JJ_DEFAULT_MODEL: ${JJ_DEFAULT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      # Outbound proxy for model calls. 127.0.0.1 here is the container itself;
      # reach a proxy on the host as host.docker.internal.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      JJ_CONCURRENCY: ${JJ_CONCURRENCY:-}
      JJ_MAX_SESSIONS_PER_TASK: ${JJ_MAX_SESSIONS_PER_TASK:-}
      JJ_MAX_DELEGATION_DEPTH: ${JJ_MAX_DELEGATION_DEPTH:-}
      JJ_TASKS_PER_BOT_PER_HOUR: ${JJ_TASKS_PER_BOT_PER_HOUR:-}
      JJ_MAX_USD_PER_DAY: ${JJ_MAX_USD_PER_DAY:-}
      JJ_OUTPUT_CAP_BYTES: ${JJ_OUTPUT_CAP_BYTES:-}
      JJ_EVENT_RETENTION_DAYS: ${JJ_EVENT_RETENTION_DAYS:-}
      JJ_EVENT_PAYLOAD_CAP_BYTES: ${JJ_EVENT_PAYLOAD_CAP_BYTES:-}
      # How long a stop lets running sessions reach a turn boundary; 20 s
      # when unset. Raising it, raise JJ_STOP_GRACE_PERIOD (stop_grace_period
      # below) with it, to at least 25 s more.
      JJ_DRAIN_TIMEOUT_SEC: ${JJ_DRAIN_TIMEOUT_SEC:-}
      # The same value as stop_grace_period below, so the app warns at boot
      # when it is too short for the drain.
      JJ_STOP_GRACE_PERIOD: ${JJ_STOP_GRACE_PERIOD:-45s}
      # JSON lines by default; `pretty` for reading by eye.
      JJ_LOG_LEVEL: ${JJ_LOG_LEVEL:-}
      JJ_LOG_FORMAT: ${JJ_LOG_FORMAT:-}
      # Traces over OTLP/HTTP, only when an endpoint is set (a collector on
      # the host is host.docker.internal:4318).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
    # Healthy while GET /health/ready answers 200: the database, migrations
    # at this build's level, the embedded worker polling and the docker
    # driver available. `up --wait` waits for it. Same as the image's own.
    healthcheck:
      test: ["CMD", "jj-healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    ports:
      # Loopback only. The token is required either way; publish wider only
      # behind HTTPS, so the token never crosses a network in the clear.
      - "127.0.0.1:${JJ_PORT:-3001}:3001"
    volumes:
      # Root-equivalent on the host. The app uses it to run sandboxes and never
      # passes it into one. Rootless Docker: set JJ_DOCKER_SOCKET to its socket.
      - ${JJ_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The entrypoint joins the socket's group and drops to JJ_APP_UID (SETUID,
    # SETGID), and init forwards stop signals to the app (KILL). The app
    # itself runs with no capabilities.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    init: true
    # `docker compose stop` or `restart` sends SIGTERM: the app drains for
    # JJ_DRAIN_TIMEOUT_SEC (default 20 s), then may take up to 20 s more to
    # release sandboxes and close (its own limit), so give this at least
    # JJ_DRAIN_TIMEOUT_SEC + 25 s; its default covers the default drain.
    # Past it, Docker kills the app, and its sessions resume as after a crash.
    stop_grace_period: ${JJ_STOP_GRACE_PERIOD:-45s}
    restart: unless-stopped

  # Builds the sandbox base image on the host's daemon, where the docker
  # driver looks for it. The container does nothing and exits at once; the app
  # waits for that exit only so that the image exists (and `up --wait` passes).
  sandbox-image:
    image: jj-sandbox:base-1
    build:
      context: packages/sandbox/images/base
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

volumes:
  jj_postgres:
