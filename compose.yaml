# Optional local database. The starter UI/API do not require it yet.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jj
      POSTGRES_PASSWORD: jj_local
      POSTGRES_DB: jj_bot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jj_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jj -d jj_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  jj_postgres:
