name: CI

on:
  # Pull requests run the gate on their merge result; pushes only on main.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Same steps as `npm run verify`, plus the sandbox image the Docker tests use. Every step must pass.
    name: Lint, typecheck, test, build
    # Runs on the runner VM itself (no job container) so tests reach its Docker daemon.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jj
          POSTGRES_PASSWORD: jj
          POSTGRES_DB: jj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jj -d jj_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Fails the job if the daemon is unreachable, so Docker-gated tests never skip silently.
      - name: Check Docker daemon
        run: docker version

      # The docker driver tests run against the real base image (JJ_SANDBOX_TEST_IMAGE below).
      - name: Build sandbox base image
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run sandbox:image

      # The checks below run even when an earlier one fails, so one run reports every failure.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Test (PostgreSQL and Docker enabled)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          JJ_TEST_DATABASE_URL: postgresql://jj:jj@127.0.0.1:5432/jj_test
          JJ_SANDBOX_TEST_IMAGE: jj-sandbox:base-1
        run: npm test

      - name: Build web
        id: build-web
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build -w @jj/web

      # Prints every chunk's size and fails when the initial JavaScript is
      # over its budget (apps/web/bundleSize.ts).
      - name: Web bundle size
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' }}
        run: npm run size -w @jj/web

      # The whole server over HTTP: PGlite, the local driver and the scripted model.
      - name: Smoke (end to end)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run smoke:e2e

  browser:
    # The web app in headless Chromium: `npm run test:browser` builds it and
    # drives the main user paths, each test on an instance of its own (PGlite,
    # the local driver and the scripted model).
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Headless runs use Chromium's headless shell, at the version the
      # pinned @playwright/test expects, with its system libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser tests
        run: npm run test:browser

      # A failed test's trace, screenshot and server log, and the HTML report.
      # A hung run fails on the suite's 8-minute global timeout, before the
      # job's limit cancels it, so this step still runs.
      - name: Upload failed tests' evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 14

  compose:
    # The product as `docker compose up` ships it: the app image, PostgreSQL and
    # the docker driver on the runner's daemon, driven over HTTP from outside.
    # Twice: with the host's Docker socket mounted into the app, and with
    # compose.socket-proxy.yaml, where the app reaches the daemon only through
    # the socket proxy and mounts no socket.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Compose stack
            files: compose.yaml
            proxy: false
          - name: Compose stack (socket proxy)
            files: compose.yaml:compose.socket-proxy.yaml
            proxy: true
    env:
      JJ_ENABLE_SCRIPTED_MODEL: "true"
      JJ_DEFAULT_MODEL: scripted/team
      # Every docker compose command below, the backup and restore scripts'
      # included, runs the stack from these files.
      COMPOSE_FILE: ${{ matrix.files }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The smoke script runs on the runner and imports the workspace packages.
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # compose.image.yaml merges with compose.yaml, alone and with the socket
      # proxy file. It is not run: its images exist once a release is tagged.
      - name: Check the optional compose files
        run: |
          docker compose -f compose.yaml -f compose.image.yaml config --quiet
          docker compose -f compose.yaml -f compose.image.yaml -f compose.socket-proxy.yaml config --quiet

      # Builds the app image and, through the sandbox-image service, jj-sandbox:base-1.
      - name: Build images
        run: docker compose build

      # --wait returns once the app is healthy (its HEALTHCHECK is /health/ready).
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180

      # Without API_TOKEN the app generated a token, which no log line prints:
      # the smoke reads it with `jj-auth token`, as a user would, so CI covers
      # the default. It also learns the app's and PostgreSQL's addresses,
      # which sandboxes must not reach.
      - name: Read the generated token and the stack's addresses
        run: |
          token=$(docker compose exec -T app jj-auth token)
          test -n "$token"
          echo "::add-mask::$token"
          echo "JJ_SMOKE_TOKEN=$token" >> "$GITHUB_ENV"
          address() { docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$(docker compose ps -q "$1")" | cut -d' ' -f1; }
          echo "JJ_SMOKE_UNREACHABLE=app:3001,postgres:5432,$(address app):3001,$(address postgres):5432" >> "$GITHUB_ENV"

      # With the proxy, the app holds no host socket: it reaches the daemon
      # through the proxy's Unix socket, which only the app's user may open,
      # and which answers 403 outside the driver's sections. The proxy has no
      # network and no TCP listener, and no other user, on the host or in the
      # app's container, can open its socket.
      - name: Check the app reaches the daemon only through the proxy
        if: ${{ matrix.proxy }}
        run: |
          app=$(docker compose ps -q app)
          proxy=$(docker compose ps -q docker-proxy)
          mounts=$(docker inspect -f '{{range .Mounts}}{{.Source}}:{{.Destination}} {{end}}' "$app")
          echo "app mounts: $mounts"
          if grep -q /var/run/docker.sock <<<"$mounts"; then exit 1; fi
          docker compose exec -T app sh -c 'test ! -e /var/run/docker.sock && test "$DOCKER_HOST" = unix:///run/docker-proxy/docker.sock'
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}} {{json .NetworkSettings.Ports}}' "$proxy")" = "none {}"
          listeners=$(docker compose exec -T docker-proxy sh -c 'cat /proc/net/tcp /proc/net/tcp6 2>/dev/null; true' | awk '$4 == "0A"')
          echo "the proxy's TCP listeners: ${listeners:-none}"
          test -z "$listeners"
          test "$(docker compose exec -T docker-proxy stat -c '%a %u' /run/docker-proxy/docker.sock)" = "600 10001"
          status() { docker compose exec -T --user "$1" app node -e 'require("node:http").get({ socketPath: "/run/docker-proxy/docker.sock", path: `/v1.41/${process.argv[1]}` }, (r) => console.log(r.statusCode)).on("error", (e) => console.log(e.code))' "$2"; }
          for allowed in _ping containers/json images/json networks volumes; do
            test "$(status 10001 "$allowed")" = 200
          done
          for refused in info swarm system/df plugins secrets events build; do
            test "$(status 10001 "$refused")" = 403
          done
          test "$(status 65534 _ping)" = EACCES
          volume=$(docker volume ls -q --filter label=com.docker.compose.volume=docker-proxy-socket)
          socket="$(docker volume inspect -f '{{.Mountpoint}}' "$volume")/docker.sock"
          for user in nobody "$(id -un)"; do
            if sudo -u "$user" curl -sS --max-time 5 --unix-socket "$socket" http://docker/_ping; then
              echo "$user on the host reached the proxy"
              exit 1
            fi
          done

      # A new install has no task workspace yet: its backup holds the
      # database alone.
      - name: Back up the new stack, before any task
        run: |
          scripts/backup.sh "$RUNNER_TEMP/fresh"
          grep -F '"volumes": [],' "$RUNNER_TEMP/fresh/manifest.json"

      # Through the published loopback port, as a browser on the host would.
      # Includes backup survival: after its first task the running stack is
      # backed up, wiped (`down -v`, its sandboxes and workspace volumes too)
      # and restored, and the rest of the smoke runs on the restored data,
      # with restart survival across `docker compose restart app`.
      - name: Smoke against the stack (docker driver, backup and restore, restart survival)
        env:
          JJ_SMOKE_BASE_URL: http://127.0.0.1:3001
          JJ_SMOKE_RESTART_COMMAND: docker compose restart app
          JJ_SMOKE_RESTORE_COMMAND: >-
            scripts/backup.sh "$RUNNER_TEMP/backup" &&
            docker compose down -v --remove-orphans &&
            { docker ps -aq --filter label=jj.sandbox.namespace=jj-bot | xargs -r docker rm -f; } &&
            { docker volume ls -q --filter label=jj.sandbox.namespace=jj-bot | xargs -r docker volume rm; } &&
            scripts/restore.sh "$RUNNER_TEMP/backup" &&
            docker compose up -d --wait --wait-timeout 180
        run: npm run smoke:e2e

      # The manifest names the versions, the migration level and the
      # workspaces; a restore into a stack that holds data is refused.
      - name: Check the backup's manifest, and that restore refuses a stack with data
        run: |
          cat "$RUNNER_TEMP/backup/manifest.json"
          grep -F '"format": "jj-bot-backup"' "$RUNNER_TEMP/backup/manifest.json"
          grep -F '"state": "current"' "$RUNNER_TEMP/backup/manifest.json"
          grep -F '"jj-bot-task-' "$RUNNER_TEMP/backup/manifest.json"
          if scripts/restore.sh "$RUNNER_TEMP/backup" 2>restore.err; then
            echo "restore replaced a stack that holds data without --force"
            exit 1
          fi
          cat restore.err
          grep -F "the stack is not empty" restore.err

      # One "Open JJ Bot" login link per boot (two, with the restart), its
      # code in the fragment, and the token in no line at all.
      - name: Check the token is kept and never printed
        run: |
          logs=$(docker compose logs --no-color app)
          carrying=$(grep -cF -- "$JJ_SMOKE_TOKEN" <<<"$logs" || true)
          opening=$(grep -cE -- 'Open JJ Bot: http://127\.0\.0\.1:3001/#/login\?code=[A-Za-z0-9_-]{43}' <<<"$logs" || true)
          echo "lines with the token: $carrying; Open JJ Bot lines: $opening"
          test "$opening" -ge 2
          test "$carrying" = 0

      # A backup holding an archive its manifest does not list (named for the
      # PostgreSQL volume) is refused before anything changes; --force then
      # replaces the stack's data with the backup's, which the app serves.
      - name: Refuse a backup with an unlisted archive, then restore with --force
        run: |
          cp -a "$RUNNER_TEMP/backup" "$RUNNER_TEMP/unlisted"
          (cd "$RUNNER_TEMP/unlisted" &&
            cp volumes/jj-bot-task-*.tar volumes/jj-bot_jj_postgres.tar &&
            sha256sum volumes/jj-bot_jj_postgres.tar >>SHA256SUMS)
          if scripts/restore.sh --force "$RUNNER_TEMP/unlisted" 2>restore.err; then
            echo "restored a backup with an unlisted archive"
            exit 1
          fi
          cat restore.err
          grep -F "is not a workspace its manifest lists" restore.err
          test -n "$(docker compose ps --status running --quiet app)"
          scripts/restore.sh --force "$RUNNER_TEMP/backup"
          docker compose up -d --wait --wait-timeout 180
          bots=$(curl -fsS -H "Authorization: Bearer $JJ_SMOKE_TOKEN" http://127.0.0.1:3001/api/bots | jq '.bots | length')
          echo "bots after the restore: $bots"
          test "$bots" = 3

      # Login codes are redacted: a log here is public.
      - name: Show the stack's state and logs
        if: ${{ failure() }}
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps | sed -E 's/(code=)[A-Za-z0-9_-]+/\1<redacted>/g'

      # Sandboxes and their volumes belong to the driver, not to compose; the
      # namespace is the project name. Containers go first, so no volume is in use.
      - name: Stop the stack and remove its volumes
        if: ${{ always() }}
        run: |
          docker compose down -v --remove-orphans
          docker ps -aq --filter label=jj.sandbox.namespace=jj-bot | xargs -r docker rm -f
          docker volume ls -q --filter label=jj.sandbox.namespace=jj-bot | xargs -r docker volume rm

  compose-https:
    # Remote access as documented: the compose `https` profile, Caddy in front
    # of the app with a certificate from a test CA (Caddy's own, `JJ_TLS=internal`)
    # for a name that resolves to the runner. The smoke runs over HTTPS from
    # outside, its event streams resumed across an app restart through Caddy,
    # and signs in to a `__Host-` Secure cookie session.
    name: Compose stack (https)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JJ_ENABLE_SCRIPTED_MODEL: "true"
      JJ_DEFAULT_MODEL: scripted/team
      COMPOSE_PROFILES: https
      API_PUBLIC_URL: https://jj.test
      JJ_TLS: internal
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve the test name to this runner
        run: echo "127.0.0.1 jj.test" | sudo tee -a /etc/hosts

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180

      # Caddy's local CA signs the certificate; the smoke, curl and Node
      # trust its root and nothing else extra.
      - name: Trust the stack's test CA
        run: |
          root=/data/caddy/pki/authorities/local/root.crt
          for _ in $(seq 1 60); do
            docker compose exec -T caddy test -s "$root" && break
            sleep 1
          done
          docker compose exec -T caddy cat "$root" >"$RUNNER_TEMP/test-ca.crt"
          openssl x509 -in "$RUNNER_TEMP/test-ca.crt" -noout -subject
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/test-ca.crt" >>"$GITHUB_ENV"
          for _ in $(seq 1 60); do
            curl -fsS --cacert "$RUNNER_TEMP/test-ca.crt" https://jj.test/health/ready && break
            sleep 2
          done
          curl -fsS --cacert "$RUNNER_TEMP/test-ca.crt" https://jj.test/health/ready

      - name: Read the token with the CLI and the stack's addresses
        run: |
          token=$(docker compose exec -T app jj-auth token)
          test -n "$token"
          echo "::add-mask::$token"
          echo "JJ_SMOKE_TOKEN=$token" >>"$GITHUB_ENV"
          address() { docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$(docker compose ps -q "$1")" | cut -d' ' -f1; }
          echo "JJ_SMOKE_UNREACHABLE=app:3001,postgres:5432,caddy:443,$(address app):3001,$(address postgres):5432" >>"$GITHUB_ENV"

      # The boot line is a login link on the https address, its code in the
      # fragment; the app answers with HSTS and the security headers through
      # Caddy, and a login link signs in to a __Host- Secure cookie. Codes and
      # the cookie are checked quietly, never printed.
      - name: Check the login link, the headers and the cookie over HTTPS
        run: |
          ca=(--cacert "$RUNNER_TEMP/test-ca.crt")
          docker compose logs --no-color app | grep -qE 'Open JJ Bot: https://jj\.test/#/login\?code=[A-Za-z0-9_-]{43}'
          curl -fsS "${ca[@]}" -D page.headers -o /dev/null https://jj.test/
          grep -i '^strict-transport-security: max-age=31536000' page.headers
          grep -i "^content-security-policy: .*frame-ancestors 'none'" page.headers
          grep -i '^x-frame-options: DENY' page.headers
          link=$(docker compose exec -T app jj-auth login-link)
          code=${link##*code=}
          echo "::add-mask::$code"
          test "$link" = "https://jj.test/#/login?code=$code"
          curl -fsS "${ca[@]}" -D login.headers -o /dev/null -H 'Content-Type: application/json' -H 'Origin: https://jj.test' --data "{\"code\":\"$code\"}" https://jj.test/api/auth/login
          grep -qiE '^set-cookie: __Host-jj_session=[A-Za-z0-9_-]{43}; Path=/; Max-Age=2592000; HttpOnly; SameSite=Strict; Secure' login.headers
          status=$(curl -sS "${ca[@]}" -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'Origin: https://jj.test' --data "{\"code\":\"$code\"}" https://jj.test/api/auth/login)
          test "$status" = 401

      # From outside, as a browser on another device would. The restart lands
      # mid-command; the task's stream resumes through Caddy with Last-Event-ID.
      - name: Smoke over HTTPS (docker driver, SSE resume across a restart, cookie session)
        env:
          JJ_SMOKE_BASE_URL: https://jj.test
          JJ_SMOKE_RESTART_COMMAND: docker compose restart app
        run: npm run smoke:e2e

      - name: Check the token is in no log line
        run: |
          logs=$(docker compose logs --no-color)
          if grep -qF -- "$JJ_SMOKE_TOKEN" <<<"$logs"; then
            echo "a log line carries the token"
            exit 1
          fi

      # Login codes are redacted: a log here is public.
      - name: Show the stack's state and logs
        if: ${{ failure() }}
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps | sed -E 's/(code=)[A-Za-z0-9_-]+/\1<redacted>/g'

      - name: Stop the stack and remove its volumes
        if: ${{ always() }}
        run: |
          docker compose down -v --remove-orphans
          docker ps -aq --filter label=jj.sandbox.namespace=jj-bot | xargs -r docker rm -f
          docker volume ls -q --filter label=jj.sandbox.namespace=jj-bot | xargs -r docker volume rm
