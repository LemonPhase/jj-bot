<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JJ Bot</title>
    <style>
      :root {
        --bg-canvas: #0a0a0c;
        --bg-sidebar: #070709;
        --bg-surface: #121216;
        --bg-surface-hover: #18181e;
        --bg-surface-active: #1f1f27;
        --bg-composer: #141419;
        --text-primary: #f4f4f6;
        --text-secondary: #9ca3af;
        --text-muted: #5b616e;
        --border-subtle: rgba(255, 255, 255, 0.07);
        --border-default: rgba(255, 255, 255, 0.12);
        --border-focus: rgba(255, 255, 255, 0.26);
        --accent-solid: #f4f4f6;
        --accent-ink: #09090b;
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }

      /* =========================================================
         GROK-INSPIRED BOT ICON CLASS ("ORBITAL SIGILS")
         ========================================================= */
      .bot-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        color: var(--text-primary);
        flex-shrink: 0;
        position: relative;
        transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
      }

      .bot-icon svg {
        width: 66%;
        height: 66%;
        display: block;
      }

      .bot-icon.xs {
        width: 22px;
        height: 22px;
      }
      .bot-icon.sm {
        width: 28px;
        height: 28px;
      }
      .bot-icon.md {
        width: 34px;
        height: 34px;
      }
      .bot-icon.lg {
        width: 56px;
        height: 56px;
        border-color: rgba(255, 255, 255, 0.18);
        background: radial-gradient(circle at 30% 25%, #1d1d24 0%, #101014 100%);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }

      /* =========================================================
         APP SHELL (SINGLE PAGE: SIDEBAR + CLEAN CHAT CANVAS)
         ========================================================= */
      .app-shell {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      /* Left Sidebar */
      .sidebar {
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        min-width: 0;
        height: 100%;
        padding: 14px 12px;
        gap: 14px;
        overflow: hidden;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 4px;
        min-width: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
        min-width: 0;
        background: transparent;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      .brand span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .icon-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }

      .icon-btn:hover {
        background: var(--bg-surface);
        color: var(--text-primary);
        border-color: var(--border-subtle);
      }

      /* Two Tabs: Bots | Tasks */
      .mode-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 3px;
        border-radius: 10px;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        flex-shrink: 0;
      }

      .mode-tab {
        border: 0;
        background: transparent;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 500;
        padding: 7px 10px;
        border-radius: 7px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mode-tab:hover {
        color: var(--text-primary);
      }

      .mode-tab.active {
        background: var(--bg-surface-active);
        color: var(--text-primary);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }

      /* Sidebar Scroll List (Strict overflow protection) */
      .nav-list-wrap {
        flex: 1;
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .nav-section-label {
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        padding: 4px 8px 6px;
        letter-spacing: 0.02em;
      }

      .nav-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .nav-list li {
        min-width: 0;
        width: 100%;
      }

      .nav-item {
        width: 100%;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 9px;
        border-radius: 9px;
        border: 0;
        background: transparent;
        color: var(--text-secondary);
        font-size: 13px;
        text-align: left;
        cursor: pointer;
        transition: background 0.14s ease, color 0.14s ease;
        overflow: hidden;
      }

      .nav-item:hover {
        background: var(--bg-surface);
        color: var(--text-primary);
      }

      .nav-item.active {
        background: var(--bg-surface-hover);
        color: var(--text-primary);
      }

      .nav-item-text {
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }

      .nav-item-title {
        display: block;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.35;
        color: inherit;
        overflow-wrap: break-word;
      }

      .nav-item-sub {
        display: block;
        font-size: 11px;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-top: 1px;
      }

      /* =========================================================
         MAIN CHAT AREA (PURE GROK INTERFACE)
         ========================================================= */
      .chat-main {
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-width: 0;
        overflow: hidden;
        background: radial-gradient(
          circle at 50% 0%,
          rgba(255, 255, 255, 0.035) 0%,
          transparent 60%
        );
      }

      /* Subtle Minimal Header */
      .chat-topbar {
        height: 52px;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-shrink: 0;
        min-width: 0;
      }

      .active-context-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        min-width: 0;
        overflow: hidden;
      }

      .active-context-label span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* =========================================================
         STATE A: INITIAL HERO CHAT (WHEN STARTING A CHAT)
         ========================================================= */
      .hero-stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 24px 64px;
        max-width: 740px;
        width: 100%;
        margin: 0 auto;
        min-width: 0;
      }

      .hero-identity {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 26px;
        max-width: 100%;
      }

      .hero-title {
        font-size: clamp(22px, 2.6vw, 30px);
        font-weight: 500;
        letter-spacing: -0.025em;
        margin: 16px 0 6px;
        color: var(--text-primary);
      }

      .hero-subtitle {
        margin: 0;
        font-size: 14px;
        color: var(--text-secondary);
        max-width: 480px;
        line-height: 1.5;
      }

      /* Grok Chat Input Box */
      .composer-box {
        width: 100%;
        background: var(--bg-composer);
        border: 1px solid var(--border-default);
        border-radius: 24px;
        padding: 14px 14px 10px 18px;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .composer-box:focus-within {
        border-color: var(--border-focus);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }

      .composer-textarea {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        resize: none;
        font-size: 15px;
        line-height: 1.5;
        color: var(--text-primary);
        min-height: 46px;
        max-height: 180px;
        display: block;
      }

      .composer-textarea::placeholder {
        color: var(--text-muted);
      }

      .composer-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 8px;
        min-width: 0;
      }

      /* Bot selector pill inside the composer (like Grok's model selector) */
      .bot-Inline-picker {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        min-width: 0;
      }

      .bot-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px 4px 5px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
      }

      .bot-pill:hover {
        background: var(--bg-surface-hover);
        color: var(--text-primary);
      }

      .bot-pill.active {
        background: var(--bg-surface-active);
        border-color: var(--border-default);
        color: var(--text-primary);
      }

      .send-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 0;
        background: var(--accent-solid);
        color: var(--accent-ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.14s ease, opacity 0.14s ease;
      }

      .send-btn:hover {
        transform: scale(1.04);
      }

      .send-btn svg {
        width: 16px;
        height: 16px;
      }

      /* =========================================================
         STATE B: ACTIVE CONVERSATION THREAD
         ========================================================= */
      .thread-stage {
        flex: 1;
        display: none;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        width: 100%;
      }

      .thread-messages {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 20px 24px 28px;
      }

      .thread-inner {
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .msg {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        min-width: 0;
      }

      .msg.user {
        justify-content: flex-end;
      }

      .msg-user-bubble {
        background: var(--bg-surface-hover);
        border: 1px solid var(--border-default);
        border-radius: 20px 20px 4px 20px;
        padding: 11px 16px;
        max-width: 78%;
        font-size: 15px;
        line-height: 1.55;
        color: var(--text-primary);
        overflow-wrap: break-word;
      }

      .msg-bot-body {
        flex: 1;
        min-width: 0;
      }

      .msg-bot-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
      }

      .msg-bot-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .msg-bot-role {
        font-size: 12px;
        color: var(--text-muted);
      }

      .msg-bot-text {
        font-size: 15px;
        line-height: 1.65;
        color: var(--text-primary);
        margin: 0;
        overflow-wrap: break-word;
      }

      .thread-composer-dock {
        padding: 8px 24px 22px;
        flex-shrink: 0;
      }

      .thread-composer-inner {
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
      }

      @media (max-width: 780px) {
        .app-shell {
          grid-template-columns: 210px minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <!-- Grok-Inspired Bot Icon Class ("Orbital Sigils") -->
    <svg width="0" height="0" style="position: absolute; pointer-events: none" aria-hidden="true">
      <defs>
        <!-- JJ Brand Core: Twin Orbital Arcs + Singularity -->
        <g id="sigil-jj">
          <path
            d="M5.8 8.2A7.5 7.5 0 0 1 18.5 8.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M18.2 15.8A7.5 7.5 0 0 1 5.5 15.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M7 17L17 7"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
          />
          <circle cx="12" cy="12" r="2" fill="currentColor" />
        </g>

        <!-- Atlas (Coordinator): Tilted Meridian Orbit + Polar Star -->
        <g id="sigil-atlas">
          <circle
            cx="12"
            cy="12"
            r="8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            opacity="0.7"
          />
          <ellipse
            cx="12"
            cy="12"
            rx="8.5"
            ry="3.4"
            transform="rotate(-30 12 12)"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
          />
          <path
            d="M12 8.2L13 11L15.8 12L13 13L12 15.8L11 13L8.2 12L11 11Z"
            fill="currentColor"
          />
        </g>

        <!-- Beacon (Researcher): Horizon Dish + Signal Slash -->
        <g id="sigil-beacon">
          <path
            d="M7.2 18A7.8 7.8 0 1 1 18 7.2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
          <path
            d="M6 18L17.5 6.5"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
          />
          <circle cx="9.2" cy="14.8" r="2.1" fill="currentColor" />
        </g>

        <!-- Cinder (Verifier): Dual Eclipse Blades + Razor Eye -->
        <g id="sigil-cinder">
          <path
            d="M4.6 11.8C6.2 7.4 10.8 5.2 15.4 6.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M19.4 12.2C17.8 16.6 13.2 18.8 8.6 17.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <polygon
            points="12,7 17,12 12,17 7,12"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <circle cx="12" cy="12" r="2" fill="currentColor" />
        </g>

        <!-- Forge (Builder): Isometric Hex Core -->
        <g id="sigil-forge">
          <path
            d="M12 3.8L19 7.8V16.2L12 20.2L5 16.2V7.8Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
          <path
            d="M5 7.8L12 12L19 7.8M12 12V20.2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.45"
          />
        </g>
      </defs>
    </svg>

    <div class="app-shell">
      <!-- LEFT SIDEBAR: Brand + Two Tabs (Bots | Tasks) + Clean List -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <button type="button" class="brand" onclick="startNewChat()">
            <span class="bot-icon sm">
              <svg viewBox="0 0 24 24"><use href="#sigil-jj" /></svg>
            </span>
            <span>JJ Bot</span>
          </button>

          <button
            type="button"
            class="icon-btn"
            onclick="startNewChat()"
            title="New chat"
            aria-label="New chat"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <!-- THE TWO TABS: Bots | Tasks -->
        <div class="mode-tabs" role="tablist" aria-label="Workspace sections">
          <button
            type="button"
            role="tab"
            id="tab-bots"
            aria-selected="true"
            class="mode-tab active"
            onclick="switchTab('bots')"
          >
            Bots
          </button>
          <button
            type="button"
            role="tab"
            id="tab-tasks"
            aria-selected="false"
            class="mode-tab"
            onclick="switchTab('tasks')"
          >
            Tasks
          </button>
        </div>

        <!-- TAB PANEL 1: BOTS LIST -->
        <div class="nav-list-wrap" id="panel-bots">
          <div class="nav-section-label">Bots</div>
          <ul class="nav-list" id="bot-nav-list">
            <li>
              <button type="button" class="nav-item active" data-bot-id="atlas" onclick="selectBot('atlas')">
                <span class="bot-icon sm">
                  <svg viewBox="0 0 24 24"><use href="#sigil-atlas" /></svg>
                </span>
                <span class="nav-item-text">
                  <span class="nav-item-title">Atlas</span>
                  <span class="nav-item-sub">Coordinator</span>
                </span>
              </button>
            </li>
            <li>
              <button type="button" class="nav-item" data-bot-id="beacon" onclick="selectBot('beacon')">
                <span class="bot-icon sm">
                  <svg viewBox="0 0 24 24"><use href="#sigil-beacon" /></svg>
                </span>
                <span class="nav-item-text">
                  <span class="nav-item-title">Beacon</span>
                  <span class="nav-item-sub">Researcher</span>
                </span>
              </button>
            </li>
            <li>
              <button type="button" class="nav-item" data-bot-id="cinder" onclick="selectBot('cinder')">
                <span class="bot-icon sm">
                  <svg viewBox="0 0 24 24"><use href="#sigil-cinder" /></svg>
                </span>
                <span class="nav-item-text">
                  <span class="nav-item-title">Cinder</span>
                  <span class="nav-item-sub">Verifier</span>
                </span>
              </button>
            </li>
            <li>
              <button type="button" class="nav-item" data-bot-id="forge" onclick="selectBot('forge')">
                <span class="bot-icon sm">
                  <svg viewBox="0 0 24 24"><use href="#sigil-forge" /></svg>
                </span>
                <span class="nav-item-text">
                  <span class="nav-item-title">Forge</span>
                  <span class="nav-item-sub">Builder</span>
                </span>
              </button>
            </li>
          </ul>
        </div>

        <!-- TAB PANEL 2: TASKS LIST -->
        <div class="nav-list-wrap" id="panel-tasks" style="display: none">
          <div class="nav-section-label">Tasks</div>
          <ul class="nav-list" id="task-nav-list">
            <li>
              <button type="button" class="nav-item" data-task-id="new" onclick="startNewTaskChat()">
                <span class="bot-icon sm">
                  <svg viewBox="0 0 24 24"><use href="#sigil-jj" /></svg>
                </span>
                <span class="nav-item-text">
                  <span class="nav-item-title">New task chat</span>
                  <span class="nav-item-sub">Start a fresh task</span>
                </span>
              </button>
            </li>
            <li>
              <button type="button" class="nav-item" data-task-id="brief" onclick="openTaskThread('brief')">
                <span class="bot-icon sm">
                  <svg viewBox="0 0 24 24"><use href="#sigil-atlas" /></svg>
                </span>
                <span class="nav-item-text">
                  <span class="nav-item-title">Compare 3 reference agent systems</span>
                  <span class="nav-item-sub">Atlas, Beacon, Cinder</span>
                </span>
              </button>
            </li>
            <li>
              <button type="button" class="nav-item" data-task-id="audit" onclick="openTaskThread('audit')">
                <span class="bot-icon sm">
                  <svg viewBox="0 0 24 24"><use href="#sigil-cinder" /></svg>
                </span>
                <span class="nav-item-text">
                  <span class="nav-item-title">Triage 34 dependency advisories</span>
                  <span class="nav-item-sub">Atlas, Cinder</span>
                </span>
              </button>
            </li>
          </ul>
        </div>
      </aside>

      <!-- MAIN GROK CHAT AREA -->
      <main class="chat-main">
        <header class="chat-topbar">
          <div class="active-context-label">
            <span class="bot-icon xs">
              <svg viewBox="0 0 24 24"><use id="topbar-sigil" href="#sigil-atlas" /></svg>
            </span>
            <span id="topbar-label">Atlas</span>
          </div>
        </header>

        <!-- INITIAL CHAT STATE (Centered Grok Prompt) -->
        <section class="hero-stage" id="hero-stage">
          <div class="hero-identity">
            <span class="bot-icon lg">
              <svg viewBox="0 0 24 24"><use id="hero-sigil" href="#sigil-atlas" /></svg>
            </span>
            <h1 class="hero-title" id="hero-title">What can Atlas help with?</h1>
            <p class="hero-subtitle" id="hero-subtitle">
              Coordinator · Breaks work down and reconciles results.
            </p>
          </div>

          <form class="composer-box" onsubmit="handleSend(event, 'hero-input')">
            <textarea
              id="hero-input"
              class="composer-textarea"
              placeholder="Ask anything..."
              rows="2"
              onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); handleSend(event, 'hero-input');}"
            ></textarea>
            <div class="composer-footer">
              <div class="bot-Inline-picker" aria-label="Active bot">
                <button type="button" class="bot-pill active" data-pill-bot="atlas" onclick="selectBot('atlas')">
                  <span class="bot-icon xs"><svg viewBox="0 0 24 24"><use href="#sigil-atlas" /></svg></span>
                  <span>Atlas</span>
                </button>
                <button type="button" class="bot-pill" data-pill-bot="beacon" onclick="selectBot('beacon')">
                  <span class="bot-icon xs"><svg viewBox="0 0 24 24"><use href="#sigil-beacon" /></svg></span>
                  <span>Beacon</span>
                </button>
                <button type="button" class="bot-pill" data-pill-bot="cinder" onclick="selectBot('cinder')">
                  <span class="bot-icon xs"><svg viewBox="0 0 24 24"><use href="#sigil-cinder" /></svg></span>
                  <span>Cinder</span>
                </button>
                <button type="button" class="bot-pill" data-pill-bot="forge" onclick="selectBot('forge')">
                  <span class="bot-icon xs"><svg viewBox="0 0 24 24"><use href="#sigil-forge" /></svg></span>
                  <span>Forge</span>
                </button>
              </div>

              <button type="submit" class="send-btn" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </form>
        </section>

        <!-- ACTIVE CHAT THREAD STATE -->
        <section class="thread-stage" id="thread-stage">
          <div class="thread-messages" id="thread-messages">
            <div class="thread-inner" id="thread-inner"></div>
          </div>

          <div class="thread-composer-dock">
            <div class="thread-composer-inner">
              <form class="composer-box" onsubmit="handleSend(event, 'thread-input')">
                <textarea
                  id="thread-input"
                  class="composer-textarea"
                  placeholder="Reply..."
                  rows="1"
                  onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); handleSend(event, 'thread-input');}"
                ></textarea>
                <div class="composer-footer">
                  <div class="bot-Inline-picker">
                    <button type="button" class="bot-pill active" data-pill-bot="atlas" onclick="selectBot('atlas')">
                      <span class="bot-icon xs"><svg viewBox="0 0 24 24"><use href="#sigil-atlas" /></svg></span>
                      <span>Atlas</span>
                    </button>
                    <button type="button" class="bot-pill" data-pill-bot="beacon" onclick="selectBot('beacon')">
                      <span class="bot-icon xs"><svg viewBox="0 0 24 24"><use href="#sigil-beacon" /></svg></span>
                      <span>Beacon</span>
                    </button>
                    <button type="button" class="bot-pill" data-pill-bot="cinder" onclick="selectBot('cinder')">
                      <span class="bot-icon xs"><svg viewBox="0 0 24 24"><use href="#sigil-cinder" /></svg></span>
                      <span>Cinder</span>
                    </button>
                  </div>

                  <button type="submit" class="send-btn" aria-label="Send message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                      <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const BOTS = {
        atlas: {
          name: "Atlas",
          role: "Coordinator",
          sigil: "#sigil-atlas",
          desc: "Coordinator · Breaks work down and reconciles results."
        },
        beacon: {
          name: "Beacon",
          role: "Researcher",
          sigil: "#sigil-beacon",
          desc: "Researcher · Finds primary sources and quotes passages."
        },
        cinder: {
          name: "Cinder",
          role: "Verifier",
          sigil: "#sigil-cinder",
          desc: "Verifier · Checks claims against cited evidence."
        },
        forge: {
          name: "Forge",
          role: "Builder",
          sigil: "#sigil-forge",
          desc: "Builder · Executes code changes and runtime tasks."
        }
      };

      const TASK_THREADS = {
        brief: {
          title: "Compare 3 reference agent systems",
          sigil: "#sigil-atlas",
          messages: [
            {
              kind: "user",
              text: "Compare the three reference agent systems for me, one page, and cite everything."
            },
            {
              kind: "bot",
              bot: "atlas",
              text: "Created the task with two checks: a citation per claim, and a 500-word budget. Delegating research to Beacon and verification to Cinder."
            },
            {
              kind: "bot",
              bot: "beacon",
              text: "Pinned the handoff tool and delivery path for the third system. Dropping the primary source links here for verification."
            },
            {
              kind: "bot",
              bot: "cinder",
              text: "One claim about the second system had no citation behind it. Sent it back to Beacon rather than passing the check."
            }
          ]
        },
        audit: {
          title: "Triage 34 dependency advisories",
          sigil: "#sigil-cinder",
          messages: [
            {
              kind: "user",
              text: "Work out which of the 34 dependency audit findings are actually reachable from our code."
            },
            {
              kind: "bot",
              bot: "atlas",
              text: "Tracing import paths across the workspace first so we only escalate advisories with a real call path."
            }
          ]
        }
      };

      let activeTab = "bots";
      let activeBotKey = "atlas";
      let currentMessages = [];

      function switchTab(tab) {
        activeTab = tab;
        document.getElementById("tab-bots").classList.toggle("active", tab === "bots");
        document.getElementById("tab-bots").setAttribute("aria-selected", String(tab === "bots"));
        document.getElementById("tab-tasks").classList.toggle("active", tab === "tasks");
        document.getElementById("tab-tasks").setAttribute("aria-selected", String(tab === "tasks"));

        document.getElementById("panel-bots").style.display = tab === "bots" ? "block" : "none";
        document.getElementById("panel-tasks").style.display = tab === "tasks" ? "block" : "none";

        if (tab === "bots") {
          selectBot(activeBotKey);
        } else {
          startNewTaskChat();
        }
      }

      function selectBot(botKey) {
        activeBotKey = botKey;
        const bot = BOTS[botKey] || BOTS.atlas;

        document.querySelectorAll("#bot-nav-list .nav-item").forEach((el) => {
          el.classList.toggle("active", el.getAttribute("data-bot-id") === botKey);
        });

        document.querySelectorAll("[data-pill-bot]").forEach((el) => {
          el.classList.toggle("active", el.getAttribute("data-pill-bot") === botKey);
        });

        document.getElementById("topbar-sigil").setAttribute("href", bot.sigil);
        document.getElementById("topbar-label").textContent = bot.name;
        document.getElementById("hero-sigil").setAttribute("href", bot.sigil);
        document.getElementById("hero-title").textContent = "What can " + bot.name + " help with?";
        document.getElementById("hero-subtitle").textContent = bot.desc;
        document.getElementById("hero-input").placeholder = "Message " + bot.name + "...";

        if (activeTab === "bots") {
          showHeroStage();
        }
      }

      function startNewChat() {
        if (activeTab === "tasks") {
          startNewTaskChat();
        } else {
          selectBot(activeBotKey);
        }
      }

      function startNewTaskChat() {
        document.querySelectorAll("#task-nav-list .nav-item").forEach((el) => {
          el.classList.toggle("active", el.getAttribute("data-task-id") === "new");
        });
        document.getElementById("topbar-sigil").setAttribute("href", "#sigil-jj");
        document.getElementById("topbar-label").textContent = "New task";
        document.getElementById("hero-sigil").setAttribute("href", "#sigil-jj");
        document.getElementById("hero-title").textContent = "What should the bots work on?";
        document.getElementById("hero-subtitle").textContent =
          "Describe a task and chat directly with your bots.";
        document.getElementById("hero-input").placeholder = "Describe a task or ask anything...";
        showHeroStage();
      }

      function showHeroStage() {
        currentMessages = [];
        document.getElementById("hero-stage").style.display = "flex";
        document.getElementById("thread-stage").style.display = "none";
      }

      function openTaskThread(taskId) {
        const task = TASK_THREADS[taskId];
        if (!task) return;

        document.querySelectorAll("#task-nav-list .nav-item").forEach((el) => {
          el.classList.toggle("active", el.getAttribute("data-task-id") === taskId);
        });

        document.getElementById("topbar-sigil").setAttribute("href", task.sigil);
        document.getElementById("topbar-label").textContent = task.title;
        currentMessages = task.messages.slice();
        renderThread();
      }

      function renderThread() {
        document.getElementById("hero-stage").style.display = "none";
        document.getElementById("thread-stage").style.display = "flex";

        const container = document.getElementById("thread-inner");
        container.innerHTML = currentMessages
          .map((m) => {
            if (m.kind === "user") {
              return `<div class="msg user"><div class="msg-user-bubble">${escapeHtml(m.text)}</div></div>`;
            }
            const b = BOTS[m.bot] || BOTS.atlas;
            return `
              <div class="msg bot">
                <span class="bot-icon md">
                  <svg viewBox="0 0 24 24"><use href="${b.sigil}" /></svg>
                </span>
                <div class="msg-bot-body">
                  <div class="msg-bot-head">
                    <span class="msg-bot-name">${b.name}</span>
                    <span class="msg-bot-role">${b.role}</span>
                  </div>
                  <p class="msg-bot-text">${escapeHtml(m.text)}</p>
                </div>
              </div>
            `;
          })
          .join("");
      }

      function handleSend(event, inputId) {
        event.preventDefault();
        const input = document.getElementById(inputId);
        const text = input.value.trim();
        if (!text) return;
        input.value = "";

        const bot = BOTS[activeBotKey] || BOTS.atlas;
        currentMessages.push({ kind: "user", text });
        currentMessages.push({
          kind: "bot",
          bot: activeBotKey,
          text: `${bot.name} is ready. (Scaffold preview — connect runtime to stream live responses.)`
        });
        renderThread();
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
    </script>
  </body>
</html>
