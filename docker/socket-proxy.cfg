# HAProxy configuration of the docker-proxy service in
# compose.socket-proxy.yaml (docs/development.md, "Docker socket proxy").
# It passes the Engine API sections the docker sandbox driver calls, and
# nothing else: no swarm, services, tasks, nodes, system, info, events,
# build, commit, plugins, secrets, configs, auth, session, distribution or
# grpc, each answered 403. It listens on a Unix socket only, owned by the
# app's user (JJ_APP_UID, which compose.socket-proxy.yaml passes; 10001 by
# default) and open to it alone.
global
    log stdout format raw daemon warning
    pidfile /run/haproxy.pid
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    # An exec's attach stream is quiet for as long as its command prints
    # nothing, and a spawned process (a stdio MCP server) waits on its input
    # between calls.
    timeout tunnel 24h
    errorfile 403 /usr/local/etc/haproxy/errors/403.http

frontend docker-api
    bind /run/docker-proxy/docker.sock mode 600 uid "${JJ_APP_UID}" gid "${JJ_APP_UID}"
    acl sections path,url_dec -m reg -i ^(/v[0-9.]+)?/(containers|exec|images|networks|volumes)(/|$)
    acl negotiation path,url_dec -m reg -i ^(/v[0-9.]+)?/(_ping|version)$
    http-request allow if sections METH_GET || sections METH_POST || sections METH_PUT || sections METH_DELETE
    http-request allow if negotiation METH_GET
    http-request deny
    default_backend dockerd

backend dockerd
    server dockerd /var/run/docker.sock
